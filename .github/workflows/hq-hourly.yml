name: HQ outages every 15 minutes
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: System libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev jq curl \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libfontconfig1-dev
      - name: Install R packages
        run: |
          install.packages(c("httr", "jsonlite", "dplyr", "tidyr", "stringr", "lubridate", "arrow", "sf", "readr", "pryr"))
        shell: Rscript {0}
      - name: Get fresh Dropbox access token
        id: dropbox_token
        run: |
          set -euo pipefail
          TOKENS=$(curl -sS -X POST https://api.dropboxapi.com/oauth2/token \
            -d grant_type=refresh_token \
            -d refresh_token="${{ secrets.DROPBOX_REFRESH_TOKEN }}" \
            -u "${{ secrets.DROPBOX_APP_KEY }}:${{ secrets.DROPBOX_APP_SECRET }}")
          ACCESS=$(echo "$TOKENS" | jq -r '.access_token // empty')
          if [ -z "$ACCESS" ]; then
            echo "::error::Dropbox refused the refresh token: $(echo "$TOKENS" | jq -c '.' 2>/dev/null || echo "$TOKENS")"
            exit 1
          fi
          echo "::add-mask::$ACCESS"
          echo "token=$ACCESS" >> "$GITHUB_OUTPUT"
      - name: Run scraper (build parquet + polygons + join)
        run: Rscript hq_scrape.R
      - name: Upload to Dropbox (data + map)
        env:
          DROPBOX_TOKEN: ${{ steps.dropbox_token.outputs.token }}
        run: |
          set -euo pipefail

          # Dropbox answers a successful upload with the stored file's
          # metadata and a rejected one (bad token, no space, rate limit)
          # with a 4xx/5xx error body. curl exits 0 either way, so check the
          # status code, then compare Dropbox's content hash against the
          # local file before counting the upload as done.
          upload_once() {
            local f="$1" remote="$2" resp code body dropbox_hash local_hash
            resp=$(curl -sS -w '\n%{http_code}' -X POST https://content.dropboxapi.com/2/files/upload \
              --header "Authorization: Bearer $DROPBOX_TOKEN" \
              --header "Dropbox-API-Arg: {\"path\": \"$remote\", \"mode\": \"overwrite\"}" \
              --header "Content-Type: application/octet-stream" \
              --data-binary @"$f" 2>&1) || true
            code=$(printf '%s\n' "$resp" | tail -n 1)
            body=$(printf '%s\n' "$resp" | sed '$d')
            if [ "$code" != "200" ]; then
              echo "    HTTP $code from Dropbox: $body"
              return 1
            fi
            dropbox_hash=$(printf '%s' "$body" | jq -r '.content_hash // empty')
            local_hash=$(python3 scripts/dropbox_content_hash.py "$f")
            if [ "$dropbox_hash" != "$local_hash" ]; then
              echo "    content hash mismatch (local $local_hash, Dropbox ${dropbox_hash:-none}): $body"
              return 1
            fi
            return 0
          }

          uploaded=0
          failed=0
          for root in data maps; do
            [ -d "$root" ] || continue
            while IFS= read -r -d '' f; do
              remote="/hq-outages/${f#*/}"
              echo "Uploading $f -> $remote"
              if upload_once "$f" "$remote" \
                || { sleep 5; upload_once "$f" "$remote"; } \
                || { sleep 15; upload_once "$f" "$remote"; }; then
                uploaded=$((uploaded + 1))
              else
                failed=$((failed + 1))
                echo "::warning::$f did not reach Dropbox after 3 attempts"
              fi
            done < <(find "$root" -type f -print0)
          done

          echo "Uploaded $uploaded file(s) to Dropbox, $failed failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed file(s) did not reach Dropbox - this scrape is not saved"
            exit 1
          fi
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::No files to upload - the scraper produced nothing"
            exit 1
          fi
